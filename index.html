<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>お絵かき</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;color:#333;background:#f4f1ec;overscroll-behavior:none}
#app{display:flex;flex-direction:column;height:100dvh}
#bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;background:#fff;border-bottom:1px solid #ddd}
.grp{display:flex;gap:4px;align-items:center}
.sep{width:1px;height:24px;background:#ddd;margin:0 2px}
button,select,input{font:inherit}
button{padding:6px 10px;border:1px solid #bbb;background:#fafafa;border-radius:6px;cursor:pointer}
button:active{background:#eee}
button.on{background:#333;color:#fff;border-color:#333}
#area{flex:1;display:flex;min-height:0}
#viewport{flex:1;position:relative;overflow:hidden;background:#cfd3d8;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:crosshair}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 2px 12px rgba(0,0,0,.35)}
#stage canvas{display:block}
#temp{position:absolute;left:0;top:0;pointer-events:none}
#panel{width:250px;padding:10px;background:#fff;border-left:1px solid #ddd;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
#panel h3{margin:0 0 4px;font-size:13px;color:#666}
#sizes{display:flex;flex-wrap:wrap;gap:4px}
#sizes button{min-width:38px;padding:6px 4px}
#palette{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
#palette button{aspect-ratio:1;padding:0;border:1px solid #888;border-radius:4px}
#palette button.sel{outline:3px solid #333;outline-offset:1px}
.row{display:flex;gap:6px;align-items:center}
#code{flex:1;min-width:0;padding:6px;border:1px solid #bbb;border-radius:6px}
#preview{width:32px;height:32px;border:1px solid #888;border-radius:6px;flex:none}
#status{font-size:12px;color:#777}
@media (max-width:720px){
  #area{flex-direction:column}
  #panel{width:100%;border-left:0;border-top:1px solid #ddd;max-height:42%}
}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <div class="grp" id="tools">
      <button data-tool="pen" class="on">✏️ ペン</button>
      <button data-tool="eraser">🧽 消しゴム</button>
      <button data-tool="eyedrop">💧 スポイト</button>
      <button data-tool="hand">✋ 手</button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button id="undo">↩ 戻す</button>
      <button id="clear">🗑 全削除</button>
      <button id="save">💾 保存</button>
    </div>
    <div class="sep"></div>
    <div class="grp">
      <button id="zout">－</button>
      <span id="zlabel" style="min-width:3em;text-align:center">×1.0</span>
      <button id="zin">＋</button>
      <button id="center">中央へ</button>
    </div>
    <span id="status">自動バックアップ: 待機中</span>
  </div>
  <div id="area">
    <div id="viewport">
      <div id="stage">
        <canvas id="main"></canvas>
        <canvas id="temp"></canvas>
      </div>
    </div>
    <div id="panel">
      <div>
        <h3>水彩ペンの濃さ</h3>
        <select id="alpha"></select>
      </div>
      <div>
        <h3>線の太さ(px)</h3>
        <div id="sizes"></div>
      </div>
      <div>
        <h3>パレット(32色)</h3>
        <div id="palette"></div>
      </div>
      <div>
        <h3>カラーコード</h3>
        <div class="row">
          <div id="preview"></div>
          <input id="code" value="#000000" maxlength="7" autocapitalize="off" autocomplete="off" spellcheck="false">
        </div>
        <button id="register" style="margin-top:6px;width:100%">選択中の枠に登録</button>
      </div>
    </div>
  </div>
</div>

<script>
// ===== 設定 =====
const W = 800, H = 600;               // キャンバスの大きさ
const ZMIN = 0.5, ZMAX = 5.0;
const SIZES = [1, 2, 3, 5, 8, 12, 20, 30];
const DEFAULT_PALETTE = [
  '#000000','#4d4d4d','#808080','#b3b3b3','#ffffff','#8b4513','#d2691e','#f4a460',
  '#ff0000','#ff4500','#ff8c00','#ffd700','#ffff00','#9acd32','#32cd32','#008000',
  '#00ced1','#1e90ff','#0000ff','#00008b','#4b0082','#8a2be2','#ff00ff','#ff69b4',
  '#ffc0cb','#ffdab9','#fff5ba','#c7f2c4','#b5ead7','#bde0fe','#cdb4ff','#e6e6fa'
];

// ===== 要素 =====
const $ = id => document.getElementById(id);
const viewport = $('viewport'), stage = $('stage'), main = $('main'), temp = $('temp');
main.width = temp.width = W; main.height = temp.height = H;
const mctx = main.getContext('2d', { willReadFrequently: true });
const tctx = temp.getContext('2d');
mctx.fillStyle = '#fff'; mctx.fillRect(0, 0, W, H);

// ===== 状態 =====
let tool = 'pen', color = '#000000', alpha = 1, size = 5;
let zoom = 1, px = 0, py = 0;
let sel = 0, dirty = false;

// ===== 表示（拡大縮小・移動） =====
function applyView() {
  stage.style.transform = `translate(${px}px,${py}px) scale(${zoom})`;
  $('zlabel').textContent = '×' + zoom.toFixed(1);
  main.style.imageRendering = zoom >= 2 ? 'pixelated' : 'auto';
}
function centerView() {
  const r = viewport.getBoundingClientRect();
  px = (r.width - W * zoom) / 2;
  py = (r.height - H * zoom) / 2;
  applyView();
}
function zoomAt(nz, cx, cy) {           // (cx,cy)=ビューポート内の基準点
  nz = Math.min(ZMAX, Math.max(ZMIN, nz));
  const ux = (cx - px) / zoom, uy = (cy - py) / zoom;
  zoom = nz; px = cx - ux * zoom; py = cy - uy * zoom;
  applyView();
}
function stepZoom(dir) {                // 0.5刻みでボタン拡大縮小
  const r = viewport.getBoundingClientRect();
  const z2 = zoom * 2;
  const nz = dir > 0 ? (Math.floor(z2 + 1e-6) + 1) / 2 : (Math.ceil(z2 - 1e-6) - 1) / 2;
  zoomAt(nz, r.width / 2, r.height / 2);
}
$('zin').onclick = () => stepZoom(1);
$('zout').onclick = () => stepZoom(-1);
$('center').onclick = centerView;

// ===== 道具 =====
function setTool(t) {
  tool = t;
  document.querySelectorAll('#tools button').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
  viewport.style.cursor = t === 'hand' ? 'grab' : 'crosshair';
}
document.querySelectorAll('#tools button').forEach(b => b.onclick = () => setTool(b.dataset.tool));

// 濃さ（ドロップダウン）
const alphaSel = $('alpha');
for (let v = 10; v <= 100; v += 10) {
  const o = document.createElement('option');
  o.value = v;
  o.textContent = v + '%' + (v === 10 ? '（薄い）' : v === 100 ? '（濃い）' : '');
  alphaSel.appendChild(o);
}
alphaSel.value = 100;
alphaSel.onchange = () => alpha = alphaSel.value / 100;

// 太さ（ボタン）
SIZES.forEach(s => {
  const b = document.createElement('button');
  b.textContent = s;
  b.classList.toggle('on', s === size);
  b.onclick = () => {
    size = s;
    document.querySelectorAll('#sizes button').forEach(x => x.classList.toggle('on', x === b));
  };
  $('sizes').appendChild(b);
});

// ===== パレット =====
function loadJSON(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function saveJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
let palette = loadJSON('oekaki-palette');
if (!Array.isArray(palette) || palette.length !== 32) palette = DEFAULT_PALETTE.slice();

function normHex(s) {
  s = s.trim().replace(/^#/, '');
  if (/^[0-9a-f]{3}$/i.test(s)) s = s.split('').map(c => c + c).join('');
  return /^[0-9a-f]{6}$/i.test(s) ? '#' + s.toLowerCase() : null;
}
function setColor(hex) {
  color = hex;
  $('code').value = hex;
  $('preview').style.background = hex;
}
function renderPalette() {
  const box = $('palette');
  box.innerHTML = '';
  palette.forEach((c, i) => {
    const b = document.createElement('button');
    b.style.background = c;
    b.title = c;
    b.classList.toggle('sel', i === sel);
    b.onclick = () => { sel = i; setColor(c); if (tool === 'eraser' || tool === 'hand') setTool('pen'); renderPalette(); };
    box.appendChild(b);
  });
}
$('code').addEventListener('input', () => {
  const h = normHex($('code').value);
  if (h) { color = h; $('preview').style.background = h; }
});
$('register').onclick = () => {
  const h = normHex($('code').value);
  if (!h) { alert('カラーコードは #ff8800 のように入力してください'); return; }
  palette[sel] = h;
  saveJSON('oekaki-palette', palette);
  setColor(h);
  renderPalette();
};
renderPalette();
setColor(palette[0]);

// ===== 描画 =====
let drawing = false, drawId = null, last, lastMid, strokeAlpha = 1;
const undoStack = [];
function pushUndo() {
  undoStack.push(mctx.getImageData(0, 0, W, H));
  if (undoStack.length > 30) undoStack.shift();
}
function undo() {
  const d = undoStack.pop();
  if (!d) return;
  mctx.putImageData(d, 0, 0);
  dirty = true;
}
function toCanvas(e) {
  const r = main.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
function startStroke(p, id) {
  pushUndo();
  drawing = true; drawId = id;
  const col = tool === 'eraser' ? '#ffffff' : color;
  strokeAlpha = tool === 'eraser' ? 1 : alpha;
  tctx.clearRect(0, 0, W, H);
  tctx.lineCap = 'round'; tctx.lineJoin = 'round';
  tctx.lineWidth = size; tctx.strokeStyle = col; tctx.fillStyle = col;
  temp.style.opacity = strokeAlpha;   // 1本の線の中で重なっても濃くならない
  tctx.beginPath(); tctx.arc(p.x, p.y, size / 2, 0, Math.PI * 2); tctx.fill();
  last = p; lastMid = p;
}
function extendStroke(p) {
  const mid = { x: (last.x + p.x) / 2, y: (last.y + p.y) / 2 };
  tctx.beginPath();
  tctx.moveTo(lastMid.x, lastMid.y);
  tctx.quadraticCurveTo(last.x, last.y, mid.x, mid.y);
  tctx.stroke();
  last = p; lastMid = mid;
}
function endStroke() {
  if (!drawing) return;
  tctx.beginPath(); tctx.moveTo(lastMid.x, lastMid.y); tctx.lineTo(last.x, last.y); tctx.stroke();
  mctx.globalAlpha = strokeAlpha;
  mctx.drawImage(temp, 0, 0);
  mctx.globalAlpha = 1;
  tctx.clearRect(0, 0, W, H);
  temp.style.opacity = 1;
  drawing = false; drawId = null;
  dirty = true;
}
function pick(p) {
  const x = Math.floor(p.x), y = Math.floor(p.y);
  if (x < 0 || y < 0 || x >= W || y >= H) return;
  const d = mctx.getImageData(x, y, 1, 1).data;
  const hex = '#' + [d[0], d[1], d[2]].map(v => v.toString(16).padStart(2, '0')).join('');
  setColor(hex);
  setTool('pen');
}

// ===== 画面の移動（ペン/マウスの手ツール・指1本） =====
let panning = false, panId = null, panStart = null;
function beginPan(id, x, y) { panning = true; panId = id; panStart = { x, y, px, py }; }
function movePan(x, y) { px = panStart.px + (x - panStart.x); py = panStart.py + (y - panStart.y); applyView(); }
function endPan() { panning = false; panId = null; }

// ===== 指の操作（1本=移動、2本=ピンチで拡大縮小） =====
const touches = new Map();   // pointerId -> {x,y}
let gesture = null;
let penDown = false, lastPenTime = 0;
function penNearby() { return penDown || performance.now() - lastPenTime < 700; }  // 手のひら対策

function startGesture() {
  const [a, b] = [...touches.values()];
  const r = viewport.getBoundingClientRect();
  gesture = {
    dist: Math.hypot(a.x - b.x, a.y - b.y) || 1,
    mx: (a.x + b.x) / 2 - r.left, my: (a.y + b.y) / 2 - r.top,
    zoom, px, py
  };
}
function onTouchDown(e) {
  if (penNearby()) return;              // ペンが近いときの指（手のひら）は無視
  viewport.setPointerCapture(e.pointerId);
  touches.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (touches.size === 1) beginPan(e.pointerId, e.clientX, e.clientY);
  else if (touches.size === 2) { endPan(); startGesture(); }
}
function onTouchMove(e) {
  const t = touches.get(e.pointerId);
  if (!t) return;
  t.x = e.clientX; t.y = e.clientY;
  if (touches.size >= 2 && gesture) {
    const [a, b] = [...touches.values()];
    const r = viewport.getBoundingClientRect();
    const dist = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    const mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
    const nz = Math.min(ZMAX, Math.max(ZMIN, gesture.zoom * dist / gesture.dist));
    const ux = (gesture.mx - gesture.px) / gesture.zoom;
    const uy = (gesture.my - gesture.py) / gesture.zoom;
    zoom = nz; px = mx - ux * nz; py = my - uy * nz;
    applyView();
  } else if (panning && e.pointerId === panId) {
    movePan(e.clientX, e.clientY);
  }
}
function onTouchEnd(e) {
  if (!touches.has(e.pointerId)) return;
  touches.delete(e.pointerId);
  gesture = null;
  if (touches.size === 0) endPan();
  else if (touches.size === 1) { const [id, t] = [...touches.entries()][0]; beginPan(id, t.x, t.y); }
  else startGesture();
}

// ===== ポインタ入力 =====
viewport.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch') { onTouchDown(e); return; }
  // ペン or マウス
  if (e.button > 0) return;
  if (e.pointerType === 'pen') { penDown = true; lastPenTime = performance.now(); }
  touches.clear(); gesture = null; endPan();       // ペンが優先
  viewport.setPointerCapture(e.pointerId);
  if (tool === 'hand') {
    beginPan(e.pointerId, e.clientX, e.clientY);
    viewport.style.cursor = 'grabbing';
    return;
  }
  const p = toCanvas(e);
  if (tool === 'eyedrop') { pick(p); return; }
  startStroke(p, e.pointerId);
});
viewport.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch') { onTouchMove(e); return; }
  if (e.pointerType === 'pen') lastPenTime = performance.now();   // ホバー中も記録
  if (panning && e.pointerId === panId) { movePan(e.clientX, e.clientY); return; }
  if (!drawing || e.pointerId !== drawId) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (evs.length ? evs : [e])) extendStroke(toCanvas(ev));
});
function pointerEnd(e) {
  if (e.pointerType === 'touch') { onTouchEnd(e); return; }
  if (e.pointerType === 'pen') { penDown = false; lastPenTime = performance.now(); }
  if (panning && e.pointerId === panId) {
    endPan();
    viewport.style.cursor = tool === 'hand' ? 'grab' : 'crosshair';
  }
  if (drawing && e.pointerId === drawId) endStroke();
}
viewport.addEventListener('pointerup', pointerEnd);
viewport.addEventListener('pointercancel', pointerEnd);
viewport.addEventListener('contextmenu', e => e.preventDefault());

// ===== ボタン =====
$('undo').onclick = undo;
$('clear').onclick = () => {
  if (!confirm('全部消しますか？（「戻す」で元に戻せます）')) return;
  pushUndo();
  mctx.fillStyle = '#fff'; mctx.fillRect(0, 0, W, H);
  dirty = true;
};
$('save').onclick = () => {
  main.toBlob(b => {
    const a = document.createElement('a');
    const d = new Date(), z = n => String(n).padStart(2, '0');
    a.href = URL.createObjectURL(b);
    a.download = `oekaki-${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}.png`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, 'image/png');
};
window.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
});

// ===== 自動バックアップ（IndexedDB） =====
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('oekaki-db', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function idbSet(k, v) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').put(v, k);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(k) {
  const db = await idb();
  return new Promise((res, rej) => {
    const rq = db.transaction('kv').objectStore('kv').get(k);
    rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
  });
}
function backup() {
  if (!dirty || drawing) return;
  dirty = false;
  main.toBlob(async b => {
    try {
      await idbSet('backup', { blob: b, time: Date.now() });
      $('status').textContent = '自動バックアップ済 ' + new Date().toLocaleTimeString('ja-JP');
    } catch (e) {
      dirty = true;
      $('status').textContent = 'バックアップ失敗';
    }
  });
}
setInterval(backup, 10000);
document.addEventListener('visibilitychange', () => { if (document.hidden) backup(); });
window.addEventListener('pagehide', backup);

(async () => {
  try {
    const rec = await idbGet('backup');
    if (rec && rec.blob) {
      const bmp = await createImageBitmap(rec.blob);
      mctx.drawImage(bmp, 0, 0);
      $('status').textContent = '前回のバックアップを復元しました';
    }
  } catch (e) {}
})();

// ===== 起動時の表示位置 =====
(function init() {
  const r = viewport.getBoundingClientRect();
  const fit = Math.min((r.width - 24) / W, (r.height - 24) / H);
  zoom = Math.max(ZMIN, Math.min(1, Math.floor(fit * 2) / 2));
  centerView();
})();
</script>
</body>
</html>
